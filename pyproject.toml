[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codelens"
version = "0.1.0"
description = "Real-time, repo-aware LLM code review agent for GitHub pushes"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.52",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "celery[redis]>=5.6,<6",
  "redis>=6.4,<7",
  "sqlalchemy>=2.0.52,<2.1",
  "alembic>=1.20,<2",
  "psycopg[binary]>=3.3,<4",
  "httpx>=0.28,<1",
  "chromadb>=1.5.9,<1.6",
  "tree-sitter>=0.26,<0.27",
  "tree-sitter-language-pack>=1.19,<2",
  "anthropic>=1.5,<2",
  "openai>=3.13,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "respx>=0.23",
  "fakeredis>=2.38",
  "ruff>=0.16",
  "mypy>=2.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", ".demo-repos"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["B008", "RUF012", "E501"]

[tool.ruff.lint.isort]
# The local alembic/ migrations directory would otherwise make "alembic" look first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
