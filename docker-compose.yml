name: codelens

# One image shared by migrate/api/worker. Only `migrate` declares `build`, so the image is built
# once instead of three concurrent builds racing to export the same tag.
x-app: &app
  image: codelens-app:latest
  pull_policy: never
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://codelens:codelens@postgres:5432/codelens
    REDIS_URL: redis://redis:6379/0
    CHROMA_MODE: http
    CHROMA_HOST: chroma
    CHROMA_PORT: "8000"
    LOCAL_REPOS_DIR: /repos
    SOURCE_MODE: ${SOURCE_MODE:-github}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev-secret-change-me}
  volumes:
    # Local-git source mode (demo + replay benchmark) reads repositories from here.
    - ./.demo-repos:/repos:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: codelens
      POSTGRES_PASSWORD: codelens
      POSTGRES_DB: codelens
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codelens -d codelens"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  chroma:
    image: chromadb/chroma:1.5.9
    environment:
      ANONYMIZED_TELEMETRY: "false"
    ports: ["8001:8000"]
    volumes: [chromadata:/data]

  migrate:
    <<: *app
    build: .
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    <<: *app
    command: ["celery", "-A", "app.celery_app", "worker", "-Q", "review,index", "--concurrency", "4", "--loglevel", "INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      chroma: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  chromadata:
