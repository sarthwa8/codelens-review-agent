server {
  listen 80;
  root /usr/share/nginx/html;

  location = /api/healthz { proxy_pass http://api:8000/healthz; }

  # Server-Sent Events: without these, nginx buffers the response and the browser receives the
  # whole review at the end instead of token by token.
  location ~ ^/api/reviews/\d+/stream$ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding on;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /webhooks/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    client_max_body_size 25m;  # GitHub's maximum webhook payload
  }

  # Single-page app: unknown paths serve index.html; hashed assets cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / {
    try_files $uri /index.html;
  }
}
